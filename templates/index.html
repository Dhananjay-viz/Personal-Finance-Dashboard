
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Finance Dashboard</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="sidebar">
    <h2>Finance<span>Pro</span></h2>
    <p class="menu-title">MENU</p>
    <a href="#" class="active">📊 Dashboard</a>
    <a href="#transactions">💳 Transactions</a>
</div>

<main class="main-content">
    <header>
        <div>
            <h1>Dashboard</h1>
            <p>Welcome back! Here's your financial overview.</p>
        </div>
        <button onclick="openForm()">+ Add Transaction</button>
        <button class="export-btn" onclick="exportTransactions()">
    Export CSV
</button>
    </header>

    <section class="cards">
        <div class="card">
            <p>Total Income</p>
            <h2 id="income">₹0</h2>
        </div>
        <div class="card">
            <p>Total Expenses</p>
            <h2 id="expenses">₹0</h2>
        </div>
        <div class="card">
            <p>Total Savings</p>
            <h2 id="savings">₹0</h2>
        </div>
    </section>

    <section class="charts">
        <div class="panel">
            <h3>Expense Categories</h3>
            <canvas id="pieChart"></canvas>
        </div>
        <div class="panel">
            <h3>Income vs Expenses</h3>
            <canvas id="barChart"></canvas>
        </div>
    </section>

    <section class="panel" id="transactions">
        <h3>Recent Transactions</h3>
<select id="monthFilter" onchange="displayTransactions()">
    <option value="">All Months</option>
</select>
<select id="categoryFilter" onchange="displayTransactions()">
    <option value="">All Categories</option>
</select>
        <input type="text" id="search"
               placeholder="Search transactions..."
               oninput="loadTransactions()">

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Type</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="transactionList"></tbody>
            </table>
        </div>
    </section>
</main>

<div class="modal" id="transactionModal">
    <div class="modal-content">
        <h2>Add Transaction</h2>

        <form id="transactionForm">
            <input type="date" id="date" required>
            <input type="text" id="description"
                   placeholder="Description" required>
            <input type="text" id="category"
                   placeholder="Category" required>

            <select id="type" required>
                <option value="Expense">Expense</option>
                <option value="Income">Income</option>
            </select>

            <input type="number" id="amount"
                   placeholder="Amount" min="0.01" step="0.01" required>

            <select id="payment_method" required>
                <option value="Cash">Cash</option>
                <option value="UPI">UPI</option>
                <option value="Debit Card">Debit Card</option>
                <option value="Net Banking">Net Banking</option>
            </select>

            <button type="submit">Save Transaction</button>
            <button type="button" class="cancel"
                    onclick="closeForm()">Cancel</button>
        </form>
    </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
